<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Street Coverage V4</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0}body{font-family:Arial}.panel{position:absolute;z-index:1000;top:8px;left:8px;right:8px;max-width:680px;background:white;border-radius:12px;padding:12px;box-shadow:0 2px 14px #0004}.collapsed .body{display:none}.title{display:flex;justify-content:space-between;font-weight:bold;font-size:18px}textarea{width:100%;height:80px;box-sizing:border-box;margin-top:8px}button,select{padding:9px;border:0;border-radius:8px;font-weight:bold}button{color:white}.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}#load{background:#1769aa}#start{background:#198754}#stop{background:#b02a37}#reset{background:#333}#center,#toggle{background:#6f42c1}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}.stat{background:#f1f3f5;border-radius:8px;padding:7px;text-align:center;font-size:12px}.stat b{display:block;font-size:15px}#status{font-size:12px;font-weight:bold;margin-top:8px}.arrow{width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:28px solid #1769aa;filter:drop-shadow(0 1px 2px #0008)}</style></head><body><div id="map"></div><div class="panel" id="panel"><div class="title"><span>🚗 Street Coverage V4</span><button id="toggle">⌃</button></div><div class="body"><textarea id="sites">LHR1234, 31.4623, 74.2952</textarea><div class="row"><button id="load">📍 Load Sites</button><select id="pick"><option value="">Select site</option></select><button id="center">🎯 Center</button></div><div class="row"><button id="start">▶ Start GPS</button><button id="stop">■ Stop</button><button id="reset">↻ Reset</button></div><div class="stats"><div class="stat">Distance<b id="dist">0 m</b></div><div class="stat">Speed<b id="speed">0 km/h</b></div><div class="stat">GPS<b id="accuracy">—</b></div><div class="stat">Roads left<b id="roads">—</b></div></div><div id="status">Enter SITE_ID, latitude, longitude</div></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map').setView([31.4623,74.2952],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap contributors'}).addTo(map);
const R=300,TOL=25;let sites=[],roads=[],visible=[],watch=null,marker=null,accCircle=null,track=null,last=null,total=0;
const $=x=>document.getElementById(x),status=x=>$('status').textContent=x;
function parse(){return $('sites').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(line=>{let p=line.split(/[,\t]+/).map(x=>x.trim()),lat=+p[p.length-2],lng=+p[p.length-1],id=p.slice(0,-2).join(' ');if(!id||!isFinite(lat)||!isFinite(lng))throw Error('Bad line: '+line);return{id,lat,lng}})}
function hav(a,b){let r=Math.PI/180,A=(b.lat-a.lat)*r,B=(b.lng-a.lng)*r,x=Math.sin(A/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(B/2)**2;return 6371000*2*Math.asin(Math.sqrt(x))}
function sd(p,a,b){let r=Math.PI/180,kx=111320*Math.cos(p.lat*r),ky=110540,P=[p.lng*kx,p.lat*ky],A=[a.lng*kx,a.lat*ky],B=[b.lng*kx,b.lat*ky],dx=B[0]-A[0],dy=B[1]-A[1],l=dx*dx+dy*dy,t=l?((P[0]-A[0])*dx+(P[1]-A[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(P[0]-(A[0]+t*dx),P[1]-(A[1]+t*dy))}
async function load(){try{sites=parse()}catch(e){status(e.message);return}roads.forEach(x=>map.removeLayer(x));roads=[];visible=[];map.eachLayer(x=>{if(x._site)map.removeLayer(x)});$('pick').innerHTML='<option value="">Select site</option>';for(let i=0;i<sites.length;i++){let s=sites[i],m=L.marker([s.lat,s.lng]).addTo(map).bindPopup('<b>'+s.id+'</b><br>'+s.lat+', '+s.lng);m._site=true;let c=L.circle([s.lat,s.lng],{radius:R,color:'#1769aa',weight:2,fillOpacity:.04}).addTo(map);c._site=true;let o=document.createElement('option');o.value=i;o.textContent=s.id;$('pick').appendChild(o)}map.fitBounds(L.latLngBounds(sites.map(s=>[s.lat,s.lng])).pad(.25));status('Loading streets…');try{for(const s of sites){let d=R/111000+.001,ld=R/(111000*Math.cos(s.lat*Math.PI/180))+.001,q=`[out:json][timeout:45];way["highway"](${s.lat-d},${s.lng-ld},${s.lat+d},${s.lng+ld});out tags geom;`,res=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q));let data=await res.json(),ok=new Set(['motorway','trunk','primary','secondary','tertiary','unclassified','residential','living_street','service']);for(const w of data.elements||[]){let t=w.tags||{},g=w.geometry||[];if(!ok.has(t.highway))continue;for(let i=0;i<g.length-1;i++){let a={lat:g[i].lat,lng:g[i].lon},b={lat:g[i+1].lat,lng:g[i+1].lon};if(Math.min(hav(s,a),hav(s,b))<=R+40){let x=L.polyline([[a.lat,a.lng],[b.lat,b.lng]],{color:'#7c3aed',weight:5});x._a=a;x._b=b;roads.push(x)}}} }visible=roads.slice();visible.forEach(x=>x.addTo(map));$('roads').textContent=visible.length;status('Ready. Start GPS.')}catch(e){status('Street data failed. Check internet.')}} 
function bearing(a,b){let r=Math.PI/180,y=Math.sin((b.lng-a.lng)*r)*Math.cos(b.lat*r),x=Math.cos(a.lat*r)*Math.sin(b.lat*r)-Math.sin(a.lat*r)*Math.cos(b.lat*r)*Math.cos((b.lng-a.lng)*r);return(Math.atan2(y,x)/r+360)%360}
function gps(pos){let p={lat:pos.coords.latitude,lng:pos.coords.longitude},acc=pos.coords.accuracy||999;$('accuracy').textContent='±'+Math.round(acc)+' m';if(!marker){marker=L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:'<div class="arrow" id="arr"></div>',iconSize:[20,28],iconAnchor:[10,18]})}).addTo(map)}else marker.setLatLng([p.lat,p.lng]);if(last){let d=hav(last,p);if(d>=2&&d<100)total+=d;let ar=$('arr');if(ar)ar.style.transform='rotate('+bearing(last,p)+'deg)';$('speed').textContent=(pos.coords.speed!=null?pos.coords.speed*3.6:d)+' km/h'}last=p;$('dist').textContent=total<1000?Math.round(total)+' m':(total/1000).toFixed(2)+' km';if(!track)track=L.polyline([[p.lat,p.lng]],{color:'#1769aa',weight:4}).addTo(map);else track.addLatLng([p.lat,p.lng]);if(acc>50){status('GPS accuracy ±'+Math.round(acc)+' m — waiting.');return}let n=[];for(const x of visible){if(sd(p,x._a,x._b)>TOL)n.push(x);else map.removeLayer(x)}visible=n;$('roads').textContent=n.length;status('GPS active • '+n.length+' road sections remaining.')}
$('load').onclick=load;$('start').onclick=()=>{if(!navigator.geolocation)return status('GPS unavailable');watch=navigator.geolocation.watchPosition(gps,e=>status('GPS error: '+e.message),{enableHighAccuracy:true,maximumAge:1000,timeout:15000});status('Waiting for GPS…')};$('stop').onclick=()=>{if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;status('GPS stopped.')};$('reset').onclick=()=>{visible.forEach(x=>map.removeLayer(x));visible=roads.slice();visible.forEach(x=>x.addTo(map));total=0;last=null;$('dist').textContent='0 m';$('roads').textContent=visible.length;if(track){map.removeLayer(track);track=null}status('Coverage reset.')};$('center').onclick=()=>{let i=$('pick').value;if(i!==''){let s=sites[+i];map.setView([s.lat,s.lng],17)}};$('toggle').onclick=()=>{$('panel').classList.toggle('collapsed');$('toggle').textContent=$('panel').classList.contains('collapsed')?'⌄':'⌃'};load();
</script></body></html>
